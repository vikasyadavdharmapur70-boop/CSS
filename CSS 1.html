<!-- second method to apply style -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Level 1</title>
    <style>
        h1{
           color: red;
        }
    </style>
</head>
<body>
    <h1>Hello vikas yadav Dharmapur!</h1>
    <h1>Hello vikas yadav Dharmapur!</h1>
     <h1>Hello vikas yadav Dharmapur!</h1>
</body>
</html>
